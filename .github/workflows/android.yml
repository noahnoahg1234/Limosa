name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Use the runner's preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties
          yes | "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Install qemu-utils (the NBD tests drive the server with qemu-io)
        run: sudo apt-get update && sudo apt-get install -y qemu-utils binutils

      - name: Core tests
        run: ./gradlew :core:test

      - name: Bundle QEMU from Termux packages
        id: qemu
        continue-on-error: true
        run: python3 scripts/fetch_qemu_termux.py --abi arm64-v8a --targets x86_64,aarch64

      - name: Remove partial QEMU bundle
        if: steps.qemu.outcome == 'failure'
        run: rm -rf app/src/main/jniLibs app/src/main/assets/qemu

      - name: Build APK
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: limosa-debug-apk${{ steps.qemu.outcome == 'success' && '-with-qemu' || '-no-qemu' }}
          path: app/build/outputs/apk/debug/*.apk
