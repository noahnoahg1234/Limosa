name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # lets the workflow publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Use the runner's preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties
          yes | "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Install qemu-utils (the NBD tests drive the server with qemu-io)
        run: sudo apt-get update && sudo apt-get install -y qemu-utils binutils patchelf

      - name: Core tests
        run: ./gradlew :core:test

      - name: Bundle QEMU from Termux packages
        id: qemu
        continue-on-error: true
        run: python3 scripts/fetch_qemu_termux.py --abi arm64-v8a --targets x86_64,aarch64

      - name: Remove partial QEMU bundle
        if: steps.qemu.outcome == 'failure'
        run: rm -rf app/src/main/jniLibs app/src/main/assets/qemu

      - name: Build APKs
        run: ./gradlew :app:assembleDebug :xr:assembleDebug

      - name: Name the APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk limosa.apk
          cp xr/build/outputs/apk/debug/xr-debug.apk limosa-xr.apk

      - uses: actions/upload-artifact@v4
        with:
          name: limosa-apk${{ steps.qemu.outcome == 'success' && '-with-qemu' || '-no-qemu' }}
          path: limosa.apk

      - uses: actions/upload-artifact@v4
        with:
          name: limosa-xr-apk
          path: limosa-xr.apk

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Limosa build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            limosa.apk
            limosa-xr.apk
          body: |
            Android APK for Limosa (arm64 phones).
            QEMU bundled: ${{ steps.qemu.outcome == 'success' && 'yes (x86-64 and ARM64 guests)' || 'no - VMs cannot start in this build; storage and dashboard still work' }}.
            Install: download `limosa.apk` on your phone, open it and allow installing from this source.
            `limosa-xr.apk` is Limosa XR, the VR headset emulator for WebXR apps.
            Built from ${{ github.sha }}.
